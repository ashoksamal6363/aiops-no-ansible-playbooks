---
- name: Project AI Ops governed restart remediation
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Restart approved deployment
      ansible.builtin.command:
        argv:
          - oc
          - rollout
          - restart
          - deployment/{{ workload_name }}
          - -n
          - "{{ namespace }}"
      changed_when: true

    - name: Wait for approved deployment rollout
      ansible.builtin.command:
        argv:
          - oc
          - rollout
          - status
          - deployment/{{ workload_name }}
          - -n
          - "{{ namespace }}"
          - --timeout=180s
      changed_when: false
